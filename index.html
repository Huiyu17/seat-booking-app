<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script>
        try {
            const consent = localStorage.getItem('sba-cookie-consent');
            if (consent === 'accepted' && localStorage.getItem('sba-theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) {}
    </script>
    <title>Project</title>
</head>
<body>
    <div class="app-top-bar" role="toolbar" aria-label="App toolbar">
        <button type="button" id="theme-toggle-btn" class="app-top-bar__btn" aria-pressed="false">Dark</button>
        <button type="button" id="lang-toggle-btn" class="app-top-bar__btn" title="Language (not implemented)">CN/EN</button>
    </div>
    <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie consent" aria-live="polite" aria-modal="false" hidden>
        <p class="cookie-banner__text">
            This site uses local storage to save your bookings and preferences.
            <a href="privacy.html">Privacy Policy</a>
        </p>
        <div class="cookie-banner__btns">
            <button id="cookie-accept-btn" class="btn" type="button">Accept All</button>
            <button id="cookie-reject-btn" class="btn" type="button">Necessary Only</button>
        </div>
    </div>
    <main id="seat-booking-app">
        <div id="settings" class="settings">
            <div class="services-list">
                <label for="services-list">Select service:</label>
                <select name="services-list" id="services-list"></select>
                <!-- <form action="#" id="settings-form" class="services-list__form"> -->
                    <label for="service-name">Movie title:</label>
                    <input type="text" name="service-name" id="service-name">
                    <label for="service-price">Price base:</label>
                    <input type="number" name="service-price" id="service-price" min="0" max="100" step="0.01">
                    <div class="services-list__btns">
                        <button id="service-add-btn" class="btn" type="button">Add new</button>
                        <button id="service-update-btn" class="btn" type="button">Save changes</button>
                        <button id="service-delete-btn" class="btn" type="button">Delete</button>
                    </div>
                <!-- </form> -->
            </div>
            <div class="sectors">
                <button id="sectors-price-btn" class="btn" type="button">Edit sectors` prices</button>
                <h3>Price multipliers for each sector:</h3>
                <ul id="sectors-list" class="sectors__list"></ul>
                <button id="sectors-save-btn" class="btn" type="button">Save</button>
            </div>
            <div id="order" class="order">
                <div class="order__header">
                    <h2>Tickets:</h2>
                </div>
                <div class="order__main">
                    <ul id="order-details"></ul>
                </div>
                <div id="order-footer" class="order__footer">
                    <span id="order-total-price"></span>
                    <button id="book-seats-btn" class="btn" type="button">Buy</button>
                </div>
            </div>
        </div>         
        <div id="screening-room-1">
            <div id="screen">Screen</div>
            <div id="seats"></div>  
        </div>
    </main>

    <script src="script/cookie-banner.js"></script>
    <script src="script/theme-controls.js"></script>
    <script src="script/seat-booking-app.js"></script>
</body>
</html>
